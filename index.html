<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <h1 id="app-title">To-Do List</h1>

      <form id="task-form" class="task-form" novalidate>
        <label for="task-input" class="sr-only">Add a task</label>
        <input
          id="task-input"
          type="text"
          placeholder="Add a new task"
          autocomplete="off"
          required
          maxlength="200"
        />
        <button type="submit">Add</button>
      </form>

      <p id="validation-message" class="validation-message" role="alert" aria-live="assertive"></p>

      <section class="toolbar" aria-label="Task filters">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="active">Active</button>
          <button type="button" class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button type="button" id="clear-completed" class="clear-btn">Clear Completed</button>
      </section>

      <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
      <p id="empty-state" class="empty-state" aria-live="polite"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
